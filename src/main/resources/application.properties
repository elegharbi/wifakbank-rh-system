# ============================================================
#  Configuration versionnée — AUCUN SECRET ICI
#
#  Chaque valeur sensible vient d'une variable d'environnement.
#  En local, les vraies valeurs sont dans application-local.properties
#  (non versionné). En production, définissez les variables chez
#  l'hébergeur : elles ont priorité sur ce fichier.
# ============================================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---------- Base de données ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/wifak_bank_rh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- Données initiales ----------
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# ---------- Serveur ----------
# L'hébergeur impose le port via PORT.
server.port=${PORT:8081}

# ---------- Assistant RH (Hugging Face) ----------
huggingface.api.token=${HUGGINGFACE_API_TOKEN:}

# ---------- E-mail ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Delais courts : un SMTP injoignable ne doit pas retenir une requete.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
